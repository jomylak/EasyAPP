[project]
name = "applypilot"
version = "0.3.0"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "Pickle-Pixel"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    # Serves the local web UI (`applypilot serve`). Loopback only -- see
    # applypilot/web/server.py for why there is deliberately no --host flag.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    ]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
applypilot = "applypilot.cli:app"

[project.urls]
Homepage = "https://github.com/Pickle-Pixel/ApplyPilot"
Repository = "https://github.com/Pickle-Pixel/ApplyPilot"
Issues = "https://github.com/Pickle-Pixel/ApplyPilot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applypilot"]

[tool.hatch.build]
artifacts = [
    "src/applypilot/config/*.yaml",
    # The built frontend ships with the package so a fresh clone can run
    # `applypilot serve` without Node installed.
    "src/applypilot/web/static/**",
]

[tool.ruff]
target-version = "py311"
line-length = 120

# Pin the ruleset explicitly. Without this, `ruff check` uses whatever the
# installed ruff's default happens to be -- 0.16 flags ~190 issues here where
# the documented E4/E7/E9/F default flags none, so CI would pass or fail
# depending purely on which ruff version the runner resolved that day.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

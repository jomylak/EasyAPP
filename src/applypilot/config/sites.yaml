# Direct career site registry for ApplyPilot
# Users can add their own sites following this pattern.
# Use {location_encoded} placeholder for location (URL-encoded).
# Use {query_encoded} placeholder for search terms (URL-encoded).

# ── Manual-Only ATS Domains ──────────────────────────────────────────────
# These ATS platforms have unsolvable CAPTCHAs. Jobs routing through them
# are flagged as "manual" during apply — bot skips, user applies by hand.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA every time

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "accenture"
    - "AccentureCareers"
    - "Workopolis"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%accenture%"
    - "%workopolis.com/out%"

# ── Blocked SSO domains — cannot authenticate through these ──────────────
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"
  - "sso.cisco.com"

# ── Low-CAPTCHA-risk ATS platforms ────────────────────────────────────────
# Platforms that have shown no CAPTCHAs in observed runs, so the agent gets
# an abbreviated CAPTCHA section instead of the full playbook. Update this
# list as more platforms are observed -- it does not need a code change.
low_captcha_risk_ats:
  - "Greenhouse"
  - "Workday"

# ── Base URLs for URL resolution ─────────────────────────────────────────
# Used by detail enrichment to resolve relative URLs scraped from sites.
# Sites not listed here (or with null) cannot have relative URLs resolved.
base_urls:
  "Intern List - SWE": "https://jobright.ai"
  "NewGrad Jobs - SWE": "https://www.newgrad-jobs.com"
  "Intern List - AIML": "https://airtable.com"
  "NewGrad Jobs - AIML": "https://airtable.com"
  "NewGrad Jobs - DE": "https://airtable.com"

sites:
  # ── Active targets ───────────────────────────────────────────────────
  # Both Intern List and NewGrad Jobs embed Jobright widgets that call
  # Jobright's own public `POST /swan/mini-sites/list` API to page through
  # results as you scroll (found by watching network traffic, confirmed
  # working with a bare curl POST -- no auth needed). Targeting that API
  # directly pulls the REAL full dataset (~3000-4700 jobs each) instead of
  # the ~20-30 rows either widget renders on its initial view, which is all
  # the earlier iframe/Airtable-scraping approaches ever saw. See
  # _scrape_jobright_minisite_api in discovery/smartextract.py.
  - name: "Intern List - SWE"
    url: "jobright-category:intern:us:swe"
    type: static

  - name: "NewGrad Jobs - SWE"
    url: "jobright-category:newgrad:us:swe"
    type: static

  # ── AIML / DE category tags ─────────────────────────────────────────
  # Unlike the SWE category above, these category tags (?k=aiml, ?k=de on
  # the site) are NOT additional slugs on Jobright's minisite API -- each
  # is backed by its own genuine Airtable shared grid view (confirmed live:
  # tab title is literally "Airtable - Grid view", not the Jobright-branded
  # widget). That means these route through _scrape_airtable_button_grid
  # (matched by "airtable.com/embed/" in the url below), NOT the API path.
  # FIXED (was a known limitation): _scrape_airtable_button_grid now scrolls
  # the grid's own scroll container round by round instead of reading only
  # the ~18-30 rows rendered on first load, and does reach the bottom of a
  # 600+ record grid (verified live, 2026-09). Live spot-checks the same
  # month found cumulative DB row counts for all three of these boards
  # exceeding their current live record count, the same healthy pattern as
  # the two fully API-verified SWE boards -- i.e. not stuck on a small
  # recency-biased slice. See _scrape_airtable_button_grid's own docstring
  # for the scroll mechanics.
  - name: "Intern List - AIML"
    url: "https://airtable.com/embed/appjSXAWiVF4d1HoZ/shrf04yGbrK3IebAl?viewControls=on"
    type: static

  - name: "NewGrad Jobs - AIML"
    url: "https://airtable.com/embed/appoxNzAIRReFCzZV/shrmDBF1vNPtzNjzl?viewControls=on"
    type: static

  - name: "NewGrad Jobs - DE"
    url: "https://airtable.com/embed/appqYfRGKpLQ8UsdH/shrFnvW20reJCEkYZ?viewControls=on"
    type: static


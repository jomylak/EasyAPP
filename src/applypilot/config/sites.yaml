# Direct career site registry for ApplyPilot
# Users can add their own sites following this pattern.
# Use {location_encoded} placeholder for location (URL-encoded).
# Use {query_encoded} placeholder for search terms (URL-encoded).

# ── Manual-Only ATS Domains ──────────────────────────────────────────────
# These ATS platforms have unsolvable CAPTCHAs. Jobs routing through them
# are flagged as "manual" during apply — bot skips, user applies by hand.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA every time

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "accenture"
    - "AccentureCareers"
    - "Workopolis"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%accenture%"
    - "%workopolis.com/out%"

# ── Blocked SSO domains — cannot authenticate through these ──────────────
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"
  - "sso.cisco.com"

# ── Base URLs for URL resolution ─────────────────────────────────────────
# Used by detail enrichment to resolve relative URLs scraped from sites.
# Sites not listed here (or with null) cannot have relative URLs resolved.
base_urls:
  "Intern List - SWE": "https://jobright.ai"
  "NewGrad Jobs - SWE": "https://www.newgrad-jobs.com"

sites:
  # ── Active targets ───────────────────────────────────────────────────
  # intern-list.com renders its job table inside a jobright.ai iframe, so the
  # wrapper page yields no Salary/Date columns -- scraping it was silently
  # dropping pay data. Target the embed directly.
  - name: "Intern List - SWE"
    url: "https://jobright.ai/minisites-jobs/intern/us/swe?embed=true"
    type: static

  # newgrad-jobs.com renders its job table inside an Airtable embed, so the
  # wrapper page (like intern-list.com before this fix) yields zero jobs --
  # confirmed via raw fetch, only ~5KB of nav/footer text, no listings. The
  # wrapper has 4 overlapping Airtable views (all/remote/no-degree/full-time
  # subsets of the same base); this targets the broadest one directly, right
  # after the page's "Entry-Level Software Engineer for New Grads" heading.
  - name: "NewGrad Jobs - SWE"
    url: "https://airtable.com/embed/appxfacPDgUWOvRWa/shr45FBB1GB53RCwo?viewControls=on"
    type: static

